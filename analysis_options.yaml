# Strict lints from Very Good Ventures (https://pub.dev/packages/very_good_analysis).
# The include names a fixed rule-set version, so a package update can't add new
# rules by surprise. To adopt newer rules, change the version here and fix what
# `flutter analyze` reports. Why: docs/DECISIONS.md (D2).
include: package:very_good_analysis/analysis_options.11.0.0.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Meant for published packages; in an app it mostly adds boilerplate.
    public_member_api_docs: false
