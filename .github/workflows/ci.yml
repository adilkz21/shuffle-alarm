# Checks every push. Pushes to main also build the web test version and
# publish it on GitHub Pages, but only after the checks pass.
# Why it is set up this way: docs/DECISIONS.md (D7).
name: CI

on:
  push:
    branches: ['**']
  # "Run workflow" button on the Actions tab, e.g. to publish again.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push cancels the older run, except on main: there a cancelled run
  # could stop a Pages deploy halfway, so main runs wait for each other.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The Flutter version on the dev machine. Update both together.
  FLUTTER_VERSION: 3.47.8

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # A third-party action, so it is pinned to a commit, not a movable tag.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  build-web:
    name: Build web app
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      # GitHub Pages serves the site from /<repo-name>/.
      - run: flutter build web --release --base-href /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can publish, and it runs no third-party code.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
